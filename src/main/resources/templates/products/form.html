<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layouts/layout :: head(${mode == 'create' ? 'Thêm Product' : 'Sửa Product'})}"></head><body><div th:replace="~{layouts/layout :: page(~{::main})}"><main><form class="form-card" th:object="${productDTO}" th:action="${mode == 'create'} ? @{/products/create} : @{/products/edit/{id}(id=${productDTO.id})}" method="post" enctype="multipart/form-data"><h1 th:text="${mode == 'create' ? 'Thêm Product' : 'Sửa Product'}"></h1><div th:if="${#fields.hasGlobalErrors()}" class="alert error"><p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p></div><label>Tên sản phẩm</label><input th:field="*{name}"><small class="error-text" th:errors="*{name}"></small><label>Mô tả</label><textarea th:field="*{description}" rows="5"></textarea><label>Giá</label><input type="number" step="0.01" th:field="*{price}"><small class="error-text" th:errors="*{price}"></small><label>Ảnh</label><input type="file" name="image" accept="image/*"><div th:if="${productDTO.imageUrl != null}"><img th:src="${#strings.substringBefore(productDTO.imageUrl,'|')}" class="preview"></div><button type="submit" class="button">Lưu</button><a class="button secondary" th:href="@{/products}">Hủy</a></form></main></div></body></html>
