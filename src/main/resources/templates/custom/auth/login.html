<!DOCTYPE html>
<html lang="vi"
	xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Đăng nhập</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">

<div class="auth-card">
	<img class="logo" th:src="@{/images/user.png}" alt="Logo">
	<h1>UTEShop</h1>
	<h2>Đăng nhập</h2>

	<div class="alert error" th:if="${param.error}">
		Username/email hoặc password không đúng
	</div>

	<div class="alert success" th:if="${param.logout}">
		Bạn đã đăng xuất
	</div>

	<form th:action="@{/custom/login}" method="post">
		<label>Username hoặc Email</label>
		<input type="text" name="username" placeholder="Username hoặc email" required autofocus>

		<label>Password</label>
		<input type="password" name="password" placeholder="Password" required>

		<button class="btn primary full" type="submit">Đăng nhập</button>
	</form>
</div>

</body>
</html>
