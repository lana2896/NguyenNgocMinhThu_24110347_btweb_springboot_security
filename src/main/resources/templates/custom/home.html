<!DOCTYPE html>
<html lang="vi"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{custom/layouts/layout}">
<head>
	<title>Trang chủ</title>
</head>
<body>

<main layout:fragment="content" class="container"
	th:with="img=${#authentication.principal.images},
		isAdmin=${#authentication.principal.role == 'ROLE_ADMIN'}">

	<section class="hero">
		<img class="avatar avatar-lg"
			th:src="@{${img != null and !#strings.isEmpty(img)
				? img
				: (isAdmin ? '/images/admin.png' : '/images/avatar-default.png')}}"
			alt="Avatar">
		<div>
			<h1>Xin chào, <span th:text="${#authentication.principal.fullName}">User</span></h1>
			<p>Chào mừng bạn đến với UTEShop.</p>
			<span class="badge" th:classappend="${isAdmin} ? 'badge-admin' : 'badge-user'"
				th:text="${#authentication.principal.role}">ROLE_USER</span>
		</div>
	</section>


</main>

</body>
</html>
